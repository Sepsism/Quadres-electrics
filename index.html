<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Quadre Elèctric Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <style>
    :root { --ample-modul: 45px; --alcada-img: 130px; }
    body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 10px; }
    
    .fila { display: flex; gap: 0; align-items: flex-end; padding: 20px 5px; border-bottom: 2px dashed #ccc; overflow-x: auto; min-height: 220px; }
    .componente { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; background: white; padding: 2px; }
    
    .mod-1 { width: calc(var(--ample-modul) * 1); }
    .mod-2 { width: calc(var(--ample-modul) * 2); }
    .mod-3 { width: calc(var(--ample-modul) * 3); }
    .mod-4 { width: calc(var(--ample-modul) * 4); }
    .mod-6 { width: calc(var(--ample-modul) * 6); }

    .img-component { height: var(--alcada-img); width: auto; object-fit: contain; object-position: bottom; }
    .inputs-container { width: 100%; display: flex; flex-direction: column; gap: 2px; }
    select { width: 100%; font-size: 0.6rem; text-align: center; }
    
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index: 1000; }
    .modal-content { background:white; margin: 5% auto; padding: 20px; width: 90%; max-width: 500px; height: 80%; overflow-y: auto; border-radius: 10px; }
    .btn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  </style>
</head>
<body>

  <input type="text" id="titol" placeholder="Nom del quadre..." style="width: 100%; font-size: 1.2rem; text-align: center; border:none; background:transparent;">
  <div id="quadre"></div>

  <div style="position:fixed; bottom:0; width:100%; display:flex; gap:5px; padding:10px; background:white;">
    <button onclick="afegirFila()">➕ Fila</button>
    <button onclick="obrirModal()">🔌 Component</button>
    <button onclick="generarPDF()">📄 PDF</button>
  </div>

  <div id="modal" class="modal"><div class="modal-content"><button onclick="tancarModal()">Tancar</button><h3>Components</h3><div id="cataleg" class="btn-grid"></div></div></div>

  <script>
    const cataleg = [
      { n: 'Sobretens.', m: 4, i: 'sobretensions.png', t: 'sobretensions' },
      { n: 'Diferencial', m: 2, i: 'diferencial.png', t: 'diferencial' },
      { n: 'PIA Normal', m: 2, i: 'pia_normal.png', t: 'pia' },
      { n: 'PIA Estret', m: 1, i: 'pia_estret.png', t: 'pia' },
      { n: 'Contactor', m: 2, i: 'contactor.png', t: 'contactor' },
      { n: 'Sobretens. Tri', m: 6, i: 'sobretensions_trifasic.png', t: 'sobretensions_tri' },
      { n: 'Dif. Trifàsic', m: 4, i: 'diferencial_trifasic.png', t: 'diferencial_tri' },
      { n: 'PIA Trifàsic', m: 4, i: 'pia_trifasic.png', t: 'pia' }
    ];

    function afegirFila() {
      const fila = document.createElement('div');
      fila.className = 'fila';
      document.getElementById('quadre').appendChild(fila);
      new Sortable(fila, { group: 'quadre', animation: 150, onEnd: autoGuardar });
    }

    function insertarComponente(mod, img, tipo) {
      const fila = document.querySelector('.fila') || (afegirFila(), document.querySelector('.fila'));
      const div = document.createElement('div');
      div.className = `componente mod-${mod}`;
      div.innerHTML = `
        <img src="${img}" class="img-component">
        <div class="inputs-container">
          <select><option>Línia...</option></select>
          <button onclick="this.parentElement.parentElement.remove(); autoGuardar()" style="font-size:0.5rem">X</button>
        </div>
      `;
      fila.appendChild(div);
      tancarModal();
      autoGuardar();
    }

    function obrirModal() { document.getElementById('modal').style.display = 'block'; }
    function tancarModal() { document.getElementById('modal').style.display = 'none'; }
    function autoGuardar() { localStorage.setItem('quadre', document.getElementById('quadre').innerHTML); localStorage.setItem('titol', document.getElementById('titol').value); }
    
    cataleg.forEach(c => {
      document.getElementById('cataleg').innerHTML += `<button onclick="insertarComponente(${c.m}, '${c.i}', '${c.t}')">${c.n}</button>`;
    });

    window.onload = () => {
      document.getElementById('quadre').innerHTML = localStorage.getItem('quadre') || '';
      document.getElementById('titol').value = localStorage.getItem('titol') || '';
      document.querySelectorAll('.fila').forEach(f => new Sortable(f, { group: 'quadre', animation: 150, onEnd: autoGuardar }));
      if(!document.querySelector('.fila')) afegirFila();
    };

    function generarPDF() { html2pdf().from(document.getElementById('quadre')).save(); }
  </script>
</body>
</html>
